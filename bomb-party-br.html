<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Detona Palavras — Dicionário Bomb Party BR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #171310;
    --bg-2: #1f1a15;
    --panel: #241d17;
    --wick: #3a2a1a;
    --fire-1: #ff7a1a;
    --fire-2: #ffb020;
    --fire-3: #ffe066;
    --wine: #4a1522;
    --text: #f3ecdf;
    --text-dim: #b8ab97;
    --text-faint: #7d7263;
    --danger: #ff4d4d;
    --safe: #6ee7a0;
    --font-display: 'Baloo 2', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100%;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(255,122,26,0.16), transparent 60%),
      radial-gradient(ellipse 700px 500px at 90% 100%, rgba(74,21,34,0.35), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    display: flex;
    justify-content: center;
    padding: 32px 18px 60px;
  }

  .wrap {
    width: 100%;
    max-width: 640px;
  }

  header {
    text-align: center;
    margin-bottom: 28px;
  }

  .fuse-icon {
    font-size: 2.4rem;
    display: inline-block;
    margin-bottom: 6px;
    filter: drop-shadow(0 0 18px rgba(255,122,26,0.5));
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(1.8rem, 6vw, 2.6rem);
    margin: 0 0 6px;
    letter-spacing: 0.5px;
    background: linear-gradient(180deg, var(--fire-3) 0%, var(--fire-1) 70%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    line-height: 1.1;
  }

  .subtitle {
    color: var(--text-dim);
    font-size: 0.92rem;
    max-width: 46ch;
    margin: 0 auto;
    line-height: 1.5;
  }

  .search-box {
    position: relative;
    margin: 26px 0 10px;
  }

  .search-box::before {
    content: "🔥";
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 1.3rem;
    pointer-events: none;
    opacity: 0.9;
  }

  #syllable {
    width: 100%;
    background: var(--panel);
    border: 2px solid var(--wick);
    border-radius: 14px;
    padding: 18px 18px 18px 54px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.4rem;
    letter-spacing: 1px;
    color: var(--fire-3);
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  #syllable::placeholder {
    color: var(--text-faint);
    font-weight: 500;
  }

  #syllable:focus {
    border-color: var(--fire-1);
    box-shadow: 0 0 0 4px rgba(255,122,26,0.18);
  }

  .meta-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 0 4px;
    margin-bottom: 18px;
    min-height: 20px;
  }

  .count {
    font-size: 0.82rem;
    color: var(--text-faint);
  }

  .count strong {
    color: var(--fire-2);
    font-weight: 600;
  }

  .clear-btn {
    background: none;
    border: none;
    color: var(--text-faint);
    font-family: var(--font-mono);
    font-size: 0.82rem;
    cursor: pointer;
    padding: 2px 4px;
    text-decoration: underline;
    text-underline-offset: 3px;
    visibility: hidden;
  }
  .clear-btn.visible { visibility: visible; }
  .clear-btn:hover { color: var(--fire-2); }

  .results {
    display: flex;
    flex-direction: column;
    gap: 2px;
    border-radius: 14px;
    overflow: hidden;
  }

  .word-row {
    background: var(--bg-2);
    padding: 13px 18px;
    font-size: 1.05rem;
    color: var(--text);
    border-left: 3px solid transparent;
    display: flex;
    align-items: baseline;
    gap: 2px;
    flex-wrap: wrap;
  }

  .word-row:nth-child(odd) { background: var(--panel); }

  .word-row mark {
    background: rgba(255,122,26,0.28);
    color: var(--fire-3);
    border-radius: 3px;
    padding: 0 1px;
    font-weight: 700;
  }

  .empty-state, .idle-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--text-faint);
    font-size: 0.95rem;
    line-height: 1.7;
  }

  .empty-state .big-emoji, .idle-state .big-emoji {
    font-size: 2.2rem;
    display: block;
    margin-bottom: 10px;
  }

  .stat-strip {
    display: flex;
    justify-content: center;
    gap: 22px;
    margin-top: 26px;
    padding-top: 18px;
    border-top: 1px solid var(--wick);
    color: var(--text-faint);
    font-size: 0.78rem;
  }

  .stat-strip b {
    color: var(--fire-2);
    display: block;
    font-size: 1.1rem;
    font-family: var(--font-display);
  }

  .stat-strip div { text-align: center; }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #171310;
    }
  }
</style>
</head>
<body>
  <div class="wrap">

      <span class="fuse-icon">💣</span>
      <h1>Detona Palavras</h1>

function stripAccents(str) {
  return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

const input = document.getElementById('syllable');
const resultsEl = document.getElementById('results');
const countEl = document.getElementById('count');
const clearBtn = document.getElementById('clearBtn');
const totalWordsEl = document.getElementById('totalWords');

totalWordsEl.textContent = DICTIONARY.length;

function highlight(word, query) {
  const normWord = stripAccents(word.toLowerCase());
  const normQuery = stripAccents(query.toLowerCase());
  const idx = normWord.indexOf(normQuery);
  if (idx === -1) return word;
  return word.slice(0, idx) + '<mark>' + word.slice(idx, idx + query.length) + '</mark>' + word.slice(idx + query.length);
}

function render() {
  const query = input.value.trim();
  clearBtn.classList.toggle('visible', query.length > 0);

  if (query === '') {
    countEl.textContent = '';
    resultsEl.innerHTML = `
      <div class="idle-state">
        <span class="big-emoji">🧨</span>
        Comece a digitar uma sílaba para ver as palavras aparecerem na hora.
      </div>`;
    return;
  }

  const normQuery = stripAccents(query.toLowerCase());
  const matches = DICTIONARY.filter(w => stripAccents(w.toLowerCase()).includes(normQuery));

  countEl.innerHTML = matches.length > 0
    ? `<strong>${matches.length}</strong> palavra${matches.length === 1 ? '' : 's'} encontrada${matches.length === 1 ? '' : 's'}`
    : '';

  if (matches.length === 0) {
    resultsEl.innerHTML = `
      <div class="empty-state">
        <span class="big-emoji">💨</span>
        Nenhuma palavra com "${query.replace(/</g,'&lt;')}" no baú.<br>Bomba desarmada, tenta outra sílaba.
      </div>`;
    return;
  }

  matches.sort((a, b) => b.length - a.length);

  resultsEl.innerHTML = matches
    .map(w => `<div class="word-row">${highlight(w, query)}</div>`)
    .join('');
}

input.addEventListener('input', render);
clearBtn.addEventListener('click', () => {
  input.value = '';
  input.focus();
  render();
});

render();
</script>
